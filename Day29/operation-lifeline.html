<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base: #080c14;
    --bg-surface: #0e1520;
    --bg-card: #131c2e;
    --bg-card-hover: #182236;
    --bg-input: #1a2540;
    --border: #1e2d47;
    --border-bright: #2a3f60;
    --text-primary: #e8edf5;
    --text-secondary: #8fa3c0;
    --text-muted: #4d6380;
    --accent-blue: #3b82f6;
    --accent-blue-dim: #1d4ed8;
    --accent-cyan: #06b6d4;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #8b5cf6;
    --accent-orange: #f97316;
    --glow-blue: rgba(59,130,246,0.15);
    --glow-green: rgba(16,185,129,0.15);
    --glow-red: rgba(239,68,68,0.15);
    --glow-amber: rgba(245,158,11,0.15);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-glow: 0 0 32px rgba(59,130,246,0.12);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
  }

  #root { min-height: 100vh; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

  /* ─── Layout ─── */
  .app-wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* ─── Cards ─── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover { border-color: var(--border-bright); box-shadow: var(--shadow-card); }
  .card-glow { box-shadow: var(--shadow-glow); border-color: var(--border-bright); }

  /* ─── Buttons ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 24px; border-radius: var(--radius-md);
    font-family: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; border: none; transition: all 0.18s; white-space: nowrap;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--accent-blue);
    color: #fff;
    box-shadow: 0 4px 16px rgba(59,130,246,0.35);
  }
  .btn-primary:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(59,130,246,0.45); }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary {
    background: var(--bg-input); color: var(--text-primary);
    border: 1px solid var(--border-bright);
  }
  .btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--accent-blue); }
  .btn-danger { background: var(--accent-red); color: #fff; box-shadow: 0 4px 16px rgba(239,68,68,0.3); }
  .btn-danger:hover { background: #dc2626; transform: translateY(-1px); }
  .btn-success { background: var(--accent-green); color: #fff; box-shadow: 0 4px 16px rgba(16,185,129,0.3); }
  .btn-success:hover { background: #059669; transform: translateY(-1px); }
  .btn-lg { padding: 16px 40px; font-size: 17px; border-radius: var(--radius-lg); }
  .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: var(--radius-sm); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  /* ─── Tags / Badges ─── */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.3px;
  }
  .badge-blue { background: rgba(59,130,246,0.15); color: var(--accent-blue); border: 1px solid rgba(59,130,246,0.25); }
  .badge-red { background: rgba(239,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(239,68,68,0.25); }
  .badge-green { background: rgba(16,185,129,0.15); color: var(--accent-green); border: 1px solid rgba(16,185,129,0.25); }
  .badge-amber { background: rgba(245,158,11,0.15); color: var(--accent-amber); border: 1px solid rgba(245,158,11,0.25); }
  .badge-purple { background: rgba(139,92,246,0.15); color: var(--accent-purple); border: 1px solid rgba(139,92,246,0.25); }
  .badge-cyan { background: rgba(6,182,212,0.15); color: var(--accent-cyan); border: 1px solid rgba(6,182,212,0.25); }

  /* ─── Progress Bars ─── */
  .progress-container { margin: 10px 0; }
  .progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .progress-label-name { color: var(--text-secondary); font-weight: 500; }
  .progress-label-val { font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .progress-track {
    height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 4px;
    transition: width 1s cubic-bezier(0.4,0,0.2,1);
  }

  /* ─── Section headers ─── */
  .section-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent-cyan); margin-bottom: 6px; }
  .section-title { font-size: 28px; font-weight: 800; color: var(--text-primary); line-height: 1.2; }
  .section-subtitle { font-size: 15px; color: var(--text-secondary); margin-top: 8px; line-height: 1.6; }

  /* ─── Grid helpers ─── */
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 768px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

  /* ─── Divider ─── */
  .divider { height: 1px; background: var(--border); margin: 24px 0; }

  /* ─── Mono text ─── */
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ─── Animations ─── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
  @keyframes countUp { from { opacity:0; } to { opacity:1; } }
  @keyframes scanline { 0% { top: -10%; } 100% { top: 110%; } }

  .fade-in { animation: fadeIn 0.45s ease forwards; }
  .slide-in { animation: slideIn 0.35s ease forwards; }

  /* ─── Welcome Screen ─── */
  .welcome-bg {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(59,130,246,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 80% 80%, rgba(6,182,212,0.05) 0%, transparent 60%),
                var(--bg-base);
    padding: 40px 20px;
    position: relative; overflow: hidden;
  }
  .welcome-grid-bg {
    position: absolute; inset: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px),
                      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.3;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 0%, transparent 80%);
  }
  .welcome-content { position: relative; text-align: center; max-width: 680px; }
  .welcome-icon { font-size: 64px; margin-bottom: 24px; display: block; }
  .welcome-title {
    font-size: clamp(32px, 5vw, 52px); font-weight: 800;
    background: linear-gradient(135deg, #e8edf5 0%, #a0b4cc 50%, var(--accent-cyan) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1.1; margin-bottom: 16px;
  }
  .welcome-subtitle { font-size: 17px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.7; }
  .welcome-tagline { font-size: 13px; color: var(--text-muted); margin-bottom: 40px; letter-spacing: 0.5px; }
  .welcome-features { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 40px; }
  .welcome-feature-pill {
    padding: 6px 14px; border-radius: 20px;
    background: var(--bg-card); border: 1px solid var(--border);
    font-size: 13px; color: var(--text-secondary);
  }

  /* ─── Step indicator ─── */
  .step-bar {
    display: flex; align-items: center; gap: 0;
    margin-bottom: 32px; overflow-x: auto; padding-bottom: 4px;
  }
  .step-item { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .step-dot-done { background: var(--accent-green); color: #fff; }
  .step-dot-active { background: var(--accent-blue); color: #fff; box-shadow: 0 0 12px rgba(59,130,246,0.5); }
  .step-dot-pending { background: var(--bg-input); color: var(--text-muted); border: 1px solid var(--border); }
  .step-label { font-size: 11px; color: var(--text-muted); margin: 0 4px; white-space: nowrap; }
  .step-connector { width: 20px; height: 2px; background: var(--border); flex-shrink: 0; }
  .step-connector-done { background: var(--accent-green); }

  /* ─── Company card ─── */
  .company-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 20px; gap: 16px; flex-wrap: wrap;
  }
  .company-logo {
    width: 56px; height: 56px; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .stat-mini { text-align: center; }
  .stat-mini-val { font-size: 20px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--text-primary); }
  .stat-mini-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ─── Crisis banner ─── */
  .crisis-banner {
    border-radius: var(--radius-lg);
    padding: 28px;
    position: relative; overflow: hidden;
    border: 1px solid rgba(239,68,68,0.3);
    background: linear-gradient(135deg, rgba(239,68,68,0.08) 0%, rgba(249,115,22,0.05) 100%);
  }
  .crisis-banner::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent-red), var(--accent-orange));
  }
  .crisis-icon { font-size: 48px; margin-bottom: 12px; display: block; }
  .crisis-title { font-size: 24px; font-weight: 800; color: var(--accent-red); margin-bottom: 8px; }
  .crisis-desc { font-size: 15px; color: var(--text-secondary); line-height: 1.7; }
  .crisis-impact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
  @media (max-width: 600px) { .crisis-impact-grid { grid-template-columns: 1fr; } }
  .impact-pill {
    padding: 12px; border-radius: var(--radius-sm);
    background: rgba(0,0,0,0.2); border: 1px solid var(--border);
    text-align: center;
  }
  .impact-pill-val { font-size: 22px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .impact-pill-label { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  /* ─── War Room ─── */
  .action-card {
    cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.2s;
  }
  .action-card:hover { transform: translateY(-2px); border-color: var(--accent-blue) !important; box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(59,130,246,0.2); }
  .action-card-selected {
    border-color: var(--accent-blue) !important;
    background: rgba(59,130,246,0.08) !important;
  }
  .action-card-selected::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--accent-blue);
  }
  .action-check {
    position: absolute; top: 12px; right: 12px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-blue); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .action-icon { font-size: 28px; margin-bottom: 8px; }
  .action-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .action-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .action-cost { font-size: 12px; color: var(--accent-amber); margin-top: 8px; font-weight: 600; }

  /* ─── Metrics ─── */
  .metric-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 20px 0; }
  @media (max-width: 900px) { .metric-row { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .metric-row { grid-template-columns: 1fr; } }
  .metric-card {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 16px; text-align: center;
  }
  .metric-val { font-size: 24px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .metric-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .metric-delta { font-size: 12px; margin-top: 4px; font-weight: 600; }
  .delta-pos { color: var(--accent-green); }
  .delta-neg { color: var(--accent-red); }

  /* ─── Negotiation ─── */
  .negotiation-stage {
    background: var(--bg-input); border-radius: var(--radius-md);
    padding: 20px; margin-bottom: 16px;
  }
  .negotiation-speaker {
    display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px;
  }
  .speaker-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    background: var(--bg-card);
  }
  .speaker-name { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .speaker-text { font-size: 14px; color: var(--text-primary); line-height: 1.6; font-style: italic; }
  .neg-option {
    display: block; width: 100%; text-align: left;
    padding: 14px 16px; border-radius: var(--radius-sm);
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-primary); cursor: pointer;
    transition: all 0.18s; font-family: inherit; font-size: 14px;
    margin-bottom: 8px;
  }
  .neg-option:hover { border-color: var(--accent-cyan); background: var(--bg-card-hover); }
  .neg-score-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .neg-score-item {
    flex: 1; min-width: 120px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px; text-align: center;
  }
  .neg-score-val { font-size: 22px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .neg-score-label { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  /* ─── CEO Boardroom ─── */
  .ceo-question-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px; margin-bottom: 16px;
  }
  .ceo-q-num { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .ceo-q-text { font-size: 16px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
  .ceo-option {
    display: block; width: 100%; text-align: left;
    padding: 14px 16px; border-radius: var(--radius-sm);
    background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text-primary); cursor: pointer;
    transition: all 0.18s; font-family: inherit; font-size: 14px;
    margin-bottom: 8px; line-height: 1.5;
  }
  .ceo-option:hover { border-color: var(--accent-purple); background: rgba(139,92,246,0.06); }
  .ceo-option-correct { border-color: var(--accent-green) !important; background: rgba(16,185,129,0.08) !important; }
  .ceo-option-wrong { border-color: var(--accent-red) !important; background: rgba(239,68,68,0.06) !important; }
  .ceo-option-neutral { border-color: var(--accent-amber) !important; }
  .ceo-explanation {
    margin-top: 12px; padding: 14px; border-radius: var(--radius-sm);
    background: rgba(0,0,0,0.3); border-left: 3px solid var(--accent-cyan);
    font-size: 13px; color: var(--text-secondary); line-height: 1.6;
  }

  /* ─── AI Strategy ─── */
  .ai-card {
    cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.2s;
  }
  .ai-card:hover { transform: translateY(-2px); border-color: var(--accent-purple) !important; }
  .ai-card-selected {
    border-color: var(--accent-purple) !important;
    background: rgba(139,92,246,0.08) !important;
  }
  .ai-icon { font-size: 32px; margin-bottom: 10px; }
  .ai-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .ai-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .ai-impact { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .ai-impact-row { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; }
  .ai-impact-label { color: var(--text-muted); }
  .ai-impact-val { color: var(--accent-green); font-weight: 600; }

  /* ─── Final Dashboard ─── */
  .score-ring-container { display: flex; justify-content: center; margin: 24px 0; }
  .score-ring {
    position: relative; width: 160px; height: 160px;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score-ring-num { font-size: 40px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
  .score-ring-label { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }

  .final-metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
  @media (max-width: 600px) { .final-metric-row { grid-template-columns: 1fr; } }
  .final-metric {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 16px;
  }
  .final-metric-name { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

  .insight-box {
    border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 12px;
    border-left: 3px solid;
  }
  .insight-mistake { background: rgba(239,68,68,0.06); border-color: var(--accent-red); }
  .insight-win { background: rgba(16,185,129,0.06); border-color: var(--accent-green); }
  .insight-tip { background: rgba(59,130,246,0.06); border-color: var(--accent-blue); }
  .insight-lesson { background: rgba(245,158,11,0.06); border-color: var(--accent-amber); }
  .insight-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .insight-text { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

  /* ─── Info tooltip style box ─── */
  .info-box {
    background: rgba(6,182,212,0.07); border: 1px solid rgba(6,182,212,0.2);
    border-radius: var(--radius-sm); padding: 14px 16px; margin: 12px 0;
    font-size: 13px; color: var(--text-secondary); line-height: 1.6;
  }
  .info-box-title { font-weight: 700; color: var(--accent-cyan); margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* ─── Misc ─── */
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .split-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .number-big { font-size: 32px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
  .text-green { color: var(--accent-green); }
  .text-red { color: var(--accent-red); }
  .text-amber { color: var(--accent-amber); }
  .text-blue { color: var(--accent-blue); }
  .text-cyan { color: var(--accent-cyan); }
  .text-purple { color: var(--accent-purple); }
  .mt-4 { margin-top: 4px; }
  .mt-8 { margin-top: 8px; }
  .mt-12 { margin-top: 12px; }
  .mt-16 { margin-top: 16px; }

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickN(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}
function clamp(v, min = 0, max = 100) { return Math.max(min, Math.min(max, v)); }

function generateCompany() {
  const industry = pick(INDUSTRIES);
  const name = pick(COMPANY_NAMES);
  const revenue = rnd(80, 900);
  const countries = pickN(COUNTRIES, rnd(3, 7));
  return {
    name,
    industry: industry.name,
    emoji: industry.emoji,
    color: industry.color,
    revenue,
    factories: rnd(2, 12),
    warehouses: rnd(4, 24),
    suppliers: rnd(30, 280),
    inventoryDays: rnd(18, 75),
    leadTimeDays: rnd(14, 90),
    countries,
    employees: rnd(800, 45000),
  };
}

function generateCrisis() {
  return { ...pick(CRISES), timestamp: new Date().toLocaleTimeString() };
}

function scoreColor(v) {
  if (v >= 75) return '#10b981';
  if (v >= 55) return '#f59e0b';
  if (v >= 35) return '#f97316';
  return '#ef4444';
}

function scoreLabel(v) {
  if (v >= 80) return 'Excellent';
  if (v >= 65) return 'Good';
  if (v >= 50) return 'Average';
  if (v >= 35) return 'Below Average';
  return 'Poor';
}

function ProgressBar({ value, max = 100, color = '#3b82f6', label, showValue = true, unit = '%' }) {
  const [displayed, setDisplayed] = useState(0);
  const pct = clamp((value / max) * 100);

  useEffect(() => {
    const timer = setTimeout(() => setDisplayed(pct), 80);
    return () => clearTimeout(timer);
  }, [pct]);

  const valColor = color;

  return (
    <div className="progress-container">
      {label && (
        <div className="progress-label">
          <span className="progress-label-name">{label}</span>
          {showValue && <span className="progress-label-val" style={{ color: valColor }}>{Math.round(value)}{unit}</span>}
        </div>
      )}
      <div className="progress-track">
        <div className="progress-fill" style={{ width: `${displayed}%`, background: color }} />
      </div>
    </div>
  );
}

function StepBar({ current }) {
  const steps = ['Company', 'Crisis', 'War Room', 'Negotiate', 'CEO', 'AI Strategy', 'Results'];
  return (
    <div className="step-bar">
      {steps.map((s, i) => {
        const done = i < current;
        const active = i === current;
        return (
          <div className="step-item" key={i}>
            {i > 0 && <div className={`step-connector ${done ? 'step-connector-done' : ''}`} />}
            <div className={`step-dot ${done ? 'step-dot-done' : active ? 'step-dot-active' : 'step-dot-pending'}`}>
              {done ? '✓' : i + 1}
            </div>
            <span className="step-label" style={{ color: active ? '#e8edf5' : undefined }}>{s}</span>
          </div>
        );
      })}
    </div>
  );
}

function WarRoomScreen({ crisis, onNext }) {
  const [selectedActions, setSelectedActions] = useState([]);
  const [simulated, setSimulated] = useState(false);
  const [metrics, setMetrics] = useState({ cost: 100, inventory: 60, profit: 75, delivery: 70, satisfaction: 65 });
  const actions = useRef(pickN(WAR_ROOM_ACTIONS, 6)).current;

  const toggle = (id) => {
    if (simulated) return;
    setSelectedActions(prev => {
      if (prev.includes(id)) return prev.filter(x => x !== id);
      if (prev.length >= 3) return prev;
      return [...prev, id];
    });
  };

  const simulate = () => {
    const chosen = actions.filter(a => selectedActions.includes(a.id));
    let m = { ...metrics };
    chosen.forEach(a => {
      m.cost = clamp(m.cost + a.effects.cost);
      m.inventory = clamp(m.inventory + a.effects.inventory);
      m.profit = clamp(m.profit + a.effects.profit);
      m.delivery = clamp(m.delivery + a.effects.delivery);
      m.satisfaction = clamp(m.satisfaction + a.effects.satisfaction);
    });
    m.cost = clamp(m.cost + crisis.revenueHit / 2);
    m.inventory = clamp(m.inventory + crisis.inventoryHit / 2);
    m.satisfaction = clamp(m.satisfaction + crisis.satisfactionHit / 3);
    setMetrics(m);
    setSimulated(true);
  };

  return (
    <div className="app-wrapper fade-in">
      <StepBar current={2} />
      <div className="section-eyebrow">War Room</div>
      <h2 className="section-title">Choose Your Response</h2>
      <p className="section-subtitle">
        You have six possible response actions. <strong>Choose exactly 3.</strong> Each action has trade-offs — there's no perfect answer. Think about which combination gives the best overall outcome.
      </p>

      <div className="info-box mt-12 mb-16">
        <div className="info-box-title">💡 How to Think About This</div>
        In a real crisis, you can't do everything. Budget, time, and human capacity are finite. Prioritize: <strong>stop the bleeding</strong> first, then <strong>restore operations</strong>, then <strong>protect relationships</strong>.
      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
        <span style={{ fontSize: 14, color: 'var(--text-secondary)' }}>Selected: <strong style={{ color: 'var(--accent-blue)' }}>{selectedActions.length} / 3</strong></span>
        {selectedActions.length === 3 && !simulated && (
          <button className="btn btn-primary" onClick={simulate}>⚡ Simulate Consequences</button>
        )}
      </div>

      <div className="grid-3" style={{ marginBottom: 24 }}>
        {actions.map(a => {
          const sel = selectedActions.includes(a.id);
          return (
            <div
              key={a.id}
              className={`card action-card ${sel ? 'action-card-selected' : ''}`}
              onClick={() => toggle(a.id)}
              style={{ cursor: simulated ? 'default' : 'pointer', opacity: (!sel && selectedActions.length >= 3 && !simulated) ? 0.5 : 1 }}
            >
              {sel && <div className="action-check">✓</div>}
              <div className="action-icon">{a.icon}</div>
              <div className="action-title">{a.title}</div>
              <div className="action-desc">{a.desc}</div>
              <div className="action-cost">{a.cost}</div>
            </div>
          );
        })}
      </div>

      {simulated && (
        <div className="fade-in">
          <div className="divider" />
          <h3 style={{ fontSize: 18, fontWeight: 700, marginBottom: 16 }}>📊 Simulated Outcomes</h3>
          <p style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 16 }}>These metrics show your company's projected state after executing your chosen responses. No choice is painless — the goal is the best possible outcome, not a perfect one.</p>
          <div className="metric-row">
            {[
              { label: 'Cost Control', val: metrics.cost, color: '#3b82f6', unit: '%' },
              { label: 'Inventory Level', val: metrics.inventory, color: '#06b6d4', unit: '%' },
              { label: 'Profitability', val: metrics.profit, color: '#10b981', unit: '%' },
              { label: 'Delivery Speed', val: metrics.delivery, color: '#f59e0b', unit: '%' },
              { label: 'Customer Satisfaction', val: metrics.satisfaction, color: '#8b5cf6', unit: '%' },
            ].map(m => (
              <div key={m.label} className="metric-card">
                <div className="metric-val" style={{ color: m.color }}>{Math.round(m.val)}<span style={{ fontSize: 14 }}>{m.unit}</span></div>
                <div className="metric-label">{m.label}</div>
                <div className="metric-delta">
                  <ProgressBar value={m.val} max={100} color={m.color} showValue={false} />
                </div>
              </div>
            ))}
          </div>
          <div style={{ textAlign: 'right', marginTop: 24 }}>
            <button className="btn btn-primary btn-lg" onClick={() => onNext(metrics, selectedActions.map(id => actions.find(a => a.id === id)))}>
              Enter Supplier Negotiation →
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function NegotiationScreen({ onNext }) {
  const [round, setRound] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [history, setHistory] = useState([]);
  const [negState, setNegState] = useState({ trust: 50, price: 100, leadTime: 45 });
  const [showFeedback, setShowFeedback] = useState(false);

  const currentRound = NEG_ROUNDS[round];

  const choose = (opt) => {
    if (chosen !== null) return;
    setChosen(opt);
    setNegState(prev => ({
      trust: clamp(prev.trust + opt.trust),
      price: clamp(prev.price + opt.price, 80, 200),
      leadTime: clamp(prev.leadTime + opt.leadTime, 5, 90),
    }));
    setShowFeedback(true);
  };

  const nextRound = () => {
    setHistory(prev => [...prev, { round: round + 1, choice: chosen }]);
    setChosen(null);
    setShowFeedback(false);
    if (round < NEG_ROUNDS.length - 1) {
      setRound(r => r + 1);
    } else {
      const score = Math.round((negState.trust / 100) * 40 + Math.max(0, (200 - negState.price) / 200) * 30 + Math.max(0, (90 - negState.leadTime) / 90) * 30);
      onNext({ score: clamp(score, 10, 100), trust: negState.trust, price: negState.price, leadTime: negState.leadTime });
    }
  };

  return (
    <div className="app-wrapper fade-in">
      <StepBar current={3} />
      <div className="section-eyebrow">Supplier Negotiation</div>
      <h2 className="section-title">The Negotiating Table</h2>
      <p className="section-subtitle">You're in a live negotiation with your key supplier. Each choice affects trust, price, and delivery speed. Think strategically — you have 4 rounds.</p>

      <div className="divider" />

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
        <div>
          <span style={{ fontSize: 13, color: 'var(--text-muted)' }}>Round {round + 1} of {NEG_ROUNDS.length}</span>
          <div className="round-dots mt-4">
            {NEG_ROUNDS.map((_, i) => (
              <div key={i} className={`round-dot ${i < round ? 'round-dot-done' : i === round ? 'round-dot-active' : 'round-dot-pending'}`} />
            ))}
          </div>
        </div>
        <div className="neg-score-row">
          {[
            { label: 'Trust', val: negState.trust, unit: '%', color: '#10b981' },
            { label: 'Price vs Contract', val: negState.price, unit: '%', color: negState.price > 120 ? '#ef4444' : '#10b981' },
            { label: 'Lead Time', val: negState.leadTime, unit: ' days', color: negState.leadTime > 60 ? '#ef4444' : '#10b981' },
          ].map(m => (
            <div key={m.label} className="neg-score-item" style={{ minWidth: 90 }}>
              <div className="neg-score-val" style={{ color: m.color }}>{Math.round(m.val)}{m.unit}</div>
              <div className="neg-score-label">{m.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="info-box mb-16">
        <div className="info-box-title">🎯 Round Context</div>
        {currentRound.context}
      </div>

      <div className="negotiation-stage">
        <div className="negotiation-speaker">
          <div className="speaker-avatar">{currentRound.avatar}</div>
          <div>
            <div className="speaker-name">{currentRound.supplier}</div>
            <div className="speaker-text">"{currentRound.speech.replace(/^"|"$/g, '')}"</div>
          </div>
        </div>

        <div style={{ borderTop: '1px solid var(--border)', paddingTop: 16 }}>
          <p style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 12 }}>Your Response — choose carefully:</p>
          {currentRound.options.map((opt, i) => (
            <button
              key={i}
              className="neg-option"
              onClick={() => choose(opt)}
              disabled={chosen !== null}
              style={{
                opacity: chosen && chosen !== opt ? 0.5 : 1,
                borderColor: chosen === opt ? 'var(--accent-cyan)' : undefined,
                background: chosen === opt ? 'rgba(6,182,212,0.08)' : undefined,
              }}
            >
              {String.fromCharCode(65 + i)}. {opt.text}
            </button>
          ))}
        </div>

        {showFeedback && chosen && (
          <div className="ceo-explanation fade-in">
            <strong style={{ color: 'var(--accent-cyan)' }}>📖 What this means:</strong> {chosen.why}
            <div style={{ marginTop: 8, display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <span className={`badge ${chosen.trust > 0 ? 'badge-green' : 'badge-red'}`}>Trust {chosen.trust > 0 ? '+' : ''}{chosen.trust}</span>
              <span className={`badge ${chosen.price < 0 ? 'badge-green' : 'badge-red'}`}>Price {chosen.price > 0 ? '+' : ''}{chosen.price}%</span>
              <span className={`badge ${chosen.leadTime < 0 ? 'badge-green' : 'badge-red'}`}>Lead Time {chosen.leadTime > 0 ? '+' : ''}{chosen.leadTime} days</span>
            </div>
            <div style={{ textAlign: 'right', marginTop: 12 }}>
              <button className="btn btn-primary btn-sm" onClick={nextRound}>
                {round < NEG_ROUNDS.length - 1 ? `Round ${round + 2} →` : 'Conclude Negotiation →'}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function CEOScreen({ company, onNext }) {
  const questions = useRef(CEO_QUESTIONS(company)).current;
  const [current, setCurrent] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [scores, setScores] = useState([]);
  const [showExp, setShowExp] = useState(false);

  const q = questions[current];

  const choose = (opt) => {
    if (chosen !== null) return;
    setChosen(opt);
    setShowExp(true);
  };

  const next = () => {
    setScores(prev => [...prev, chosen.score]);
    setChosen(null);
    setShowExp(false);
    if (current < questions.length - 1) {
      setCurrent(c => c + 1);
    } else {
      const total = [...scores, chosen.score].reduce((a, b) => a + b, 0);
      const max = questions.length * 10;
      onNext(Math.round((total / max) * 100));
    }
  };

  const optionClass = (opt) => {
    if (!chosen) return '';
    if (opt === chosen) {
      if (opt.label === 'correct') return 'ceo-option-correct';
      if (opt.label === 'wrong') return 'ceo-option-wrong';
      return 'ceo-option-neutral';
    }
    if (opt.label === 'correct') return 'ceo-option-correct';
    return '';
  };

  return (
    <div className="app-wrapper fade-in">
      <StepBar current={4} />
      <div className="section-eyebrow">CEO Boardroom</div>
      <h2 className="section-title">Executive Decision-Making</h2>
      <p className="section-subtitle">You're in the boardroom. Five critical leadership decisions. These test how you think, not just what you know. There's no trick — just strategic reasoning.</p>

      <div className="divider" />

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
        <span style={{ fontSize: 13, color: 'var(--text-muted)' }}>Question {current + 1} of {questions.length}</span>
        <div style={{ display: 'flex', gap: 6 }}>
          {questions.map((_, i) => (
            <div key={i} style={{
              width: 24, height: 6, borderRadius: 3,
              background: i < current ? 'var(--accent-green)' : i === current ? 'var(--accent-blue)' : 'var(--border)'
            }} />
          ))}
        </div>
      </div>

      <div className="info-box mb-16">
        <div className="info-box-title">📍 Situation Context</div>
        {q.context}
      </div>

      <div className="ceo-question-card">
        <div className="ceo-q-num">Question {current + 1}</div>
        <div className="ceo-q-text">{q.q}</div>

        {q.options.map((opt, i) => (
          <button
            key={i}
            className={`ceo-option ${optionClass(opt)}`}
            onClick={() => choose(opt)}
            disabled={chosen !== null}
          >
            <span style={{ fontWeight: 700, marginRight: 8, color: 'var(--accent-blue)' }}>{String.fromCharCode(65 + i)}.</span>
            {opt.text}
          </button>
        ))}

        {showExp && chosen && (
          <div className="ceo-explanation fade-in">
            <strong style={{ color: chosen.label === 'correct' ? 'var(--accent-green)' : chosen.label === 'wrong' ? 'var(--accent-red)' : 'var(--accent-amber)' }}>
              {chosen.label === 'correct' ? '✅ Strong choice.' : chosen.label === 'wrong' ? '❌ Risky approach.' : '⚠️ Partially effective.'}
            </strong>{' '}
            {chosen.exp}
            <div style={{ textAlign: 'right', marginTop: 12 }}>
              <button className="btn btn-primary btn-sm" onClick={next}>
                {current < questions.length - 1 ? `Next Question →` : 'View CEO Score →'}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

              </div>}
              <div className="ai-icon">{ai.icon}</div>
              <div className="ai-title">{ai.title}</div>
              <div className="ai-desc">{ai.desc}</div>
              <div className="info-box" style={{ margin: '10px 0', padding: '10px 12px' }}>
                <div style={{ fontSize: 12, color: 'var(--text-muted)' }}><strong style={{ color: 'var(--accent-cyan)' }}>How it works:</strong> {ai.what}</div>
              </div>
              <div className="ai-impact">
                {ai.impacts.map(imp => (
                  <div key={imp.label} className="ai-impact-row">
                    <span className="ai-impact-label">{imp.label}</span>
                    <span className="ai-impact-val">{imp.val}</span>
                  </div>
                ))}
                <div className="ai-impact-row" style={{ marginTop: 8, borderTop: '1px solid var(--border)', paddingTop: 8 }}>
                  <span className="ai-impact-label">Annual Cost</span>
                  <span style={{ fontSize: 12, color: 'var(--accent-amber)', fontWeight: 600 }}>{ai.cost}</span>
                </div>
                <div className="ai-impact-row">
                  <span className="ai-impact-label">Payback Period</span>
                  <span style={{ fontSize: 12, color: 'var(--accent-green)', fontWeight: 600 }}>{ai.payback}</span>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {confirmed && (
        <div className="fade-in">
          <div className="card" style={{ background: 'rgba(139,92,246,0.08)', borderColor: 'rgba(139,92,246,0.3)', marginBottom: 24 }}>
            <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>🚀 Your AI Roadmap</h3>
            {selected.map(id => {
              const ai = AI_INVESTMENTS.find(a => a.id === id);
              return (
                <div key={id} style={{ display: 'flex', gap: 12, alignItems: 'flex-start', marginBottom: 12 }}>
                  <span style={{ fontSize: 24 }}>{ai.icon}</span>
                  <div>
                    <strong style={{ fontSize: 14 }}>{ai.title}</strong>
                    <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>Expected ROI payback in {ai.payback} · Cost: {ai.cost}</p>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ textAlign: 'right' }}>
            <button className="btn btn-primary btn-lg" onClick={() => onNext(selected)}>
              View Final Results →
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ScoreRing({ score }) {
  const color = scoreColor(score);
  const r = 68;
  const circ = 2 * Math.PI * r;
  const [dash, setDash] = useState(circ);
  useEffect(() => {
    setTimeout(() => setDash(circ - (score / 100) * circ), 200);
  }, [score]);

  return (
    <div className="score-ring">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r={r} fill="none" stroke="var(--bg-input)" strokeWidth="12" />
        <circle
          cx="80" cy="80" r={r} fill="none"
          stroke={color} strokeWidth="12"
          strokeDasharray={circ}
          strokeDashoffset={dash}
          strokeLinecap="round"
          style={{ transition: 'stroke-dashoffset 1.5s cubic-bezier(0.4,0,0.2,1)' }}
        />
      </svg>
      <div className="score-ring-text">
        <div className="score-ring-num" style={{ color }}>{score}</div>
        <div className="score-ring-label">{scoreLabel(score)}</div>
      </div>
    </div>
  );
}

function FinalDashboard({ company, crisis, warMetrics, negResult, ceoScore, aiChoices, warActions, onReplay }) {
  const resilience = clamp(Math.round((warMetrics.inventory + warMetrics.delivery) / 2));
  const costControl = clamp(Math.round(warMetrics.cost));
  const riskMgmt = clamp(Math.round((negResult.trust + ceoScore) / 2));
  const custSat = clamp(Math.round(warMetrics.satisfaction));
  const leadership = clamp(ceoScore);
  const negotiation = clamp(negResult.score);

  const overall = clamp(Math.round(
    resilience * 0.15 + costControl * 0.15 + riskMgmt * 0.15 +
    custSat * 0.15 + leadership * 0.2 + negotiation * 0.2
  ));

  const scores = [
    { label: 'Leadership', val: leadership, color: '#8b5cf6' },
    { label: 'Negotiation', val: negotiation, color: '#06b6d4' },
    { label: 'Resilience', val: resilience, color: '#10b981' },
    { label: 'Cost Control', val: costControl, color: '#3b82f6' },
    { label: 'Risk Management', val: riskMgmt, color: '#f59e0b' },
    { label: 'Customer Satisfaction', val: custSat, color: '#f97316' },
  ];

  // Find lowest for mistake, highest for win
  const sortedScores = [...scores].sort((a, b) => a.val - b.val);
  const worstDim = sortedScores[0];
  const bestDim = sortedScores[sortedScores.length - 1];

  const feedbackMap = {
    Leadership: ['You demonstrated strong executive judgment under pressure.', 'Your leadership decisions need more strategic depth.'],
    Negotiation: ['You built a win-win supplier relationship — a rare skill.', 'Negotiation outcomes suggest a more transactional approach.'],
    Resilience: ['Your supply chain held together better than most under this pressure.', 'Resilience gaps need addressing before the next disruption.'],
    'Cost Control': ['You balanced speed and cost effectively.', 'Financial discipline was sacrificed for speed — recalibrate.'],
    'Risk Management': ['Proactive risk thinking was evident in your decisions.', 'Risk management felt reactive rather than strategic.'],
    'Customer Satisfaction': ['You protected customer relationships despite the crisis.', 'Customer impact was higher than necessary — communication helps.'],
  };

  const recMap = {
    Leadership: 'Build a Crisis Command Playbook with pre-approved decision trees for your top 10 crisis scenarios.',
    Negotiation: 'Implement Supplier Relationship Management (SRM) programs — monthly check-ins prevent adversarial negotiations in crises.',
    Resilience: 'Map your supply chain\'s single points of failure and dual-source your top 20% of suppliers by spend.',
    'Cost Control': 'Model cost/speed trade-offs in advance with scenario planning so you\'re not making $10M decisions under pressure.',
    'Risk Management': 'Deploy a supplier risk intelligence platform — early warning is always cheaper than emergency response.',
    'Customer Satisfaction': 'Build a customer communication protocol for disruptions: who calls whom, with what information, by when.',
  };

  const lessonsMap = {
    Leadership: '🎯 The best leaders in a crisis communicate more than they think is necessary and involve their teams in solutions.',
    Negotiation: '🤝 Suppliers are partners, not vending machines. The relationship you build today determines the service you get in a crisis.',
    Resilience: '🏗️ Resilience is built in normal times. Every day without a crisis is an opportunity to prepare for the next one.',
    'Cost Control': '💰 In a crisis, every hour of delay costs more than the money saved by slow decisions. Speed has a monetary value.',
    'Risk Management': '🛡️ Risk that isn\'t monitored is risk that will surprise you. What you measure, you can manage.',
    'Customer Satisfaction': '📞 A customer who hears bad news from you first trusts you more than one who hears silence and discovers it themselves.',
  };

  const globalFeedback = overall >= 75
    ? `You navigated this ${crisis.title.toLowerCase()} with genuine strategic skill. ${company.name} is in capable hands.`
    : overall >= 55
    ? `A solid performance under pressure. Some decisions were stronger than others — that's what growth looks like.`
    : `This crisis exposed real gaps in crisis readiness. The good news: every one of them is fixable with the right preparation.`;

  return (
    <div className="app-wrapper fade-in">
      <StepBar current={6} />
      <div className="section-eyebrow">Final Results</div>
      <h2 className="section-title">Crisis Debrief</h2>
      <p className="section-subtitle">Here's how you performed across every dimension of the simulation. This is your leadership fingerprint.</p>

      <div className="divider" />

      {/* Overall Score */}
      <div className="card card-glow" style={{ marginBottom: 24, textAlign: 'center', padding: 40 }}>
        <p style={{ fontSize: 13, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 8 }}>{company.name} · {crisis.title}</p>
        <div className="score-ring-container">
          <ScoreRing score={overall} />
        </div>
        <h3 style={{ fontSize: 20, fontWeight: 700, marginTop: 12, marginBottom: 8 }}>Overall Crisis Score</h3>
        <p style={{ fontSize: 15, color: 'var(--text-secondary)', maxWidth: 520, margin: '0 auto' }}>{globalFeedback}</p>
      </div>

      {/* Sub-scores */}
      <div className="final-metric-row" style={{ marginBottom: 24 }}>
        {scores.map(s => (
          <div key={s.label} className="final-metric">
            <div className="final-metric-name">{s.label}</div>
            <div style={{ fontSize: 28, fontWeight: 900, fontFamily: 'JetBrains Mono', color: scoreColor(s.val), marginBottom: 8 }}>{s.val}</div>
            <ProgressBar value={s.val} max={100} color={s.color} showValue={false} />
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 6 }}>{scoreLabel(s.val)}</div>
          </div>
        ))}
      </div>

      <div className="divider" />

      {/* Performance breakdown bars */}
      <div className="card" style={{ marginBottom: 24 }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>📊 Detailed Performance</h3>
        {scores.map(s => (
          <ProgressBar key={s.label} label={s.label} value={s.val} max={100} color={s.color} />
        ))}
      </div>

      {/* Insights */}
      <h3 style={{ fontSize: 18, fontWeight: 700, marginBottom: 16 }}>🔍 Personalized Analysis</h3>

      <div className="insight-box insight-mistake">
        <div className="insight-label" style={{ color: 'var(--accent-red)' }}>⚠ Biggest Gap</div>
        <div className="insight-text">
          <strong>{worstDim.label} — {worstDim.val}/100.</strong>{' '}
          {feedbackMap[worstDim.label][1]}
        </div>
      </div>

      <div className="insight-box insight-win">
        <div className="insight-label" style={{ color: 'var(--accent-green)' }}>🏆 Strongest Performance</div>
        <div className="insight-text">
          <strong>{bestDim.label} — {bestDim.val}/100.</strong>{' '}
          {feedbackMap[bestDim.label][0]}
        </div>
      </div>

      <div className="insight-box insight-tip">
        <div className="insight-label" style={{ color: 'var(--accent-blue)' }}>💡 Expert Recommendation</div>
        <div className="insight-text">{recMap[worstDim.label]}</div>
      </div>

      <div className="insight-box insight-lesson">
        <div className="insight-label" style={{ color: 'var(--accent-amber)' }}>📚 Key Lesson</div>
        <div className="insight-text">{lessonsMap[worstDim.label]}</div>
      </div>

      <div className="divider" />

      {/* Negotiation summary */}
      <div className="card" style={{ marginBottom: 24 }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>🤝 Negotiation Outcome</h3>
        <div className="grid-3">
          {[
            { label: 'Supplier Trust', val: negResult.trust, unit: '%', color: '#10b981' },
            { label: 'Final Price vs Contract', val: negResult.price, unit: '%', color: negResult.price > 120 ? '#ef4444' : '#10b981' },
            { label: 'Lead Time Achieved', val: negResult.leadTime, unit: ' days', color: negResult.leadTime > 45 ? '#ef4444' : '#10b981' },
          ].map(m => (
            <div key={m.label} className="final-metric">
              <div className="final-metric-name">{m.label}</div>
              <div style={{ fontSize: 28, fontWeight: 900, fontFamily: 'JetBrains Mono', color: m.color }}>{Math.round(m.val)}{m.unit}</div>
            </div>
          ))}
        </div>
      </div>

      {/* AI summary */}
      <div className="card" style={{ marginBottom: 24 }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>🤖 AI Investments Made</h3>
        <div className="grid-2">
          {aiChoices.map(id => {
            const ai = AI_INVESTMENTS.find(a => a.id === id);
            return (
              <div key={id} style={{ display: 'flex', gap: 12 }}>
                <span style={{ fontSize: 28 }}>{ai.icon}</span>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{ai.title}</div>
                  <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>Payback: {ai.payback} · {ai.cost}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Replay */}
      <div style={{ textAlign: 'center', padding: '32px 0' }}>
        <p style={{ fontSize: 14, color: 'var(--text-muted)', marginBottom: 20 }}>Every playthrough uses a different company, crisis, and scenario — try a new run to test different strategies.</p>
        <button className="btn btn-primary btn-lg" onClick={onReplay}>
          🔄 Play Again with New Scenario
        </button>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────

function App() {
  const [screen, setScreen] = useState('welcome');
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [warMetrics, setWarMetrics] = useState(null);
  const [warActions, setWarActions] = useState([]);
  const [negResult, setNegResult] = useState(null);
  const [ceoScore, setCeoScore] = useState(0);
  const [aiChoices, setAiChoices] = useState([]);

  const startGame = () => {
    setCompany(generateCompany());
    setCrisis(generateCrisis());
    setScreen('company');
    window.scrollTo(0, 0);
  };

  const go = (s) => {
    setScreen(s);
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 50);
  };

  const replay = () => {
    setCompany(null); setCrisis(null); setWarMetrics(null);
    setWarActions([]); setNegResult(null); setCeoScore(0); setAiChoices([]);
    setScreen('welcome');
    window.scrollTo(0, 0);
  };

  if (screen === 'welcome') return <WelcomeScreen onStart={startGame} />;
  if (screen === 'company') return <CompanyScreen company={company} onNext={() => go('crisis')} />;
  if (screen === 'crisis') return <CrisisScreen company={company} crisis={crisis} onNext={() => go('warroom')} />;
  if (screen === 'warroom') return <WarRoomScreen crisis={crisis} onNext={(metrics, actions) => {
    setWarMetrics(metrics); setWarActions(actions); go('negotiation');
  }} />;
  if (screen === 'negotiation') return <NegotiationScreen onNext={(result) => { setNegResult(result); go('ceo'); }} />;
  if (screen === 'ceo') return <CEOScreen company={company} onNext={(score) => { setCeoScore(score); go('ai'); }} />;
  if (screen === 'ai') return <AIStrategyScreen onNext={(choices) => { setAiChoices(choices); go('final'); }} />;
  if (screen === 'final') return (
    <FinalDashboard
      company={company} crisis={crisis} warMetrics={warMetrics}
      negResult={negResult} ceoScore={ceoScore} aiChoices={aiChoices}
      warActions={warActions} onReplay={replay}
    />
  );

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
