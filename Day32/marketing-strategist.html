<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Think Like a Marketing Strategist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg: #0d0d0f;
    --bg2: #141418;
    --bg3: #1a1a22;
    --card: #1e1e28;
    --card2: #252530;
    --border: #2e2e3e;
    --border2: #3a3a4e;
    --text: #e8e8f0;
    --text2: #9898b0;
    --text3: #6060780;
    --accent: #7c6af0;
    --accent2: #9f91f5;
    --accent-bg: rgba(124,106,240,0.12);
    --green: #3ecf8e;
    --green-bg: rgba(62,207,142,0.12);
    --amber: #f5a623;
    --amber-bg: rgba(245,166,35,0.12);
    --red: #e25c5c;
    --red-bg: rgba(226,92,92,0.12);
    --blue: #4fa8e8;
    --blue-bg: rgba(79,168,232,0.12);
    --pink: #e86fa3;
    --pink-bg: rgba(232,111,163,0.12);
    --teal: #38c8c8;
    --teal-bg: rgba(56,200,200,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }
  #root { min-height: 100vh; }

  .app { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }
  
  /* Progress */
  .progress-bar { display: flex; gap: 6px; margin-bottom: 32px; }
  .progress-step {
    flex: 1; height: 3px; border-radius: 2px;
    background: var(--border); transition: background 0.4s;
  }
  .progress-step.done { background: var(--accent); }
  .progress-step.active { background: var(--accent2); }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-sm { padding: 16px 20px; }
  .card-hover:hover { border-color: var(--border2); background: var(--card2); cursor: pointer; }
  .card-selected { border-color: var(--accent) !important; background: var(--accent-bg) !important; }
  
  /* Typography */
  h1 { font-size: 2rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.5px; }
  h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
  h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: var(--text2); font-size: 1rem; line-height: 1.6; margin-top: 8px; }
  .label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; }
  .muted { color: var(--text2); }
  .small { font-size: 0.85rem; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 10px; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; border: none; transition: all 0.2s;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--accent); color: #fff;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-secondary {
    background: var(--card2); color: var(--text); border: 1px solid var(--border2);
  }
  .btn-secondary:hover { background: var(--border); }
  .btn-ghost { background: transparent; color: var(--text2); padding: 8px 14px; }
  .btn-ghost:hover { color: var(--text); background: var(--card2); }
  .btn-big {
    padding: 16px 24px; border-radius: 14px; font-size: 1rem;
    width: 100%; justify-content: center; margin-bottom: 12px;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
  }
  .badge-purple { background: var(--accent-bg); color: var(--accent2); }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }
  .badge-teal { background: var(--teal-bg); color: var(--teal); }
  .badge-pink { background: var(--pink-bg); color: var(--pink); }

  /* Grid */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media(max-width:600px) { .grid2,.grid3 { grid-template-columns: 1fr; } }

  /* Tag */
  .tag {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 0.78rem; font-weight: 500;
    background: var(--card2); border: 1px solid var(--border2); color: var(--text2);
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  /* Explanation box */
  .explain-box {
    background: var(--bg2); border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0; padding: 14px 16px; margin: 12px 0;
  }
  .explain-box .label { color: var(--accent2); }

  /* Claude prompt card */
  .prompt-card {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border: 1px solid var(--accent);
    border-radius: 14px; padding: 20px; margin-top: 24px;
  }
  .prompt-card .prompt-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .prompt-card .prompt-icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: white;
  }
  .prompt-card .prompt-title { font-weight: 600; font-size: 0.9rem; color: var(--accent2); }
  .prompt-code {
    background: rgba(0,0,0,0.4); border-radius: 8px; padding: 12px 14px;
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem;
    color: #b8d4ff; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .copy-btn {
    margin-top: 10px; padding: 6px 14px; border-radius: 8px; font-size: 0.78rem;
    background: var(--accent-bg); color: var(--accent2); border: 1px solid var(--accent);
    cursor: pointer; transition: all 0.2s;
  }
  .copy-btn:hover { background: var(--accent); color: white; }

  /* Section header */
  .section-header { margin-bottom: 24px; }
  .section-header .step-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
    background: var(--accent-bg); color: var(--accent2); margin-bottom: 12px;
  }

  /* Platform card */
  .platform-card {
    border-radius: 12px; border: 1px solid var(--border); padding: 16px;
    cursor: pointer; transition: all 0.2s; background: var(--card);
  }
  .platform-card:hover { border-color: var(--border2); background: var(--card2); }
  .platform-card.selected { border-color: var(--accent); background: var(--accent-bg); }
  .platform-card.not-recommended { opacity: 0.6; }
  .platform-icon { font-size: 1.6rem; margin-bottom: 8px; }
  .platform-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
  .platform-why { font-size: 0.8rem; color: var(--text2); line-height: 1.4; }

  /* Pillar card */
  .pillar-card {
    border-radius: 12px; border: 1px solid var(--border); padding: 18px;
    cursor: pointer; transition: all 0.2s; background: var(--card);
    position: relative;
  }
  .pillar-card:hover { border-color: var(--border2); }
  .pillar-card.selected { border-color: var(--accent); background: var(--accent-bg); }
  .pillar-card.maxed { opacity: 0.5; pointer-events: none; }
  .pillar-num {
    position: absolute; top: 14px; right: 14px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--accent); color: white;
    font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  /* Roadmap week */
  .week-block {
    border-left: 2px solid var(--accent); padding-left: 20px; margin-bottom: 24px; position: relative;
  }
  .week-block::before {
    content: ''; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); position: absolute; left: -6px; top: 4px;
  }
  .week-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent2); margin-bottom: 6px; }
  .week-goal { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
  .week-tactic { font-size: 0.85rem; color: var(--text2); }

  /* Event card */
  .event-card {
    border-radius: 14px; padding: 24px;
    border: 2px solid var(--amber); background: var(--amber-bg);
  }
  .event-emoji { font-size: 2.5rem; margin-bottom: 12px; }
  .response-option {
    border-radius: 10px; border: 1px solid var(--border2); padding: 14px 16px;
    cursor: pointer; transition: all 0.2s; margin-bottom: 10px;
    background: var(--card);
  }
  .response-option:hover { border-color: var(--accent); background: var(--accent-bg); }
  .response-option.chosen { border-color: var(--green); background: var(--green-bg); }

  /* Report */
  .report-section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .report-score {
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  }
  .score-bar-outer {
    flex: 1; height: 6px; border-radius: 3px; background: var(--border);
  }
  .score-bar-inner {
    height: 6px; border-radius: 3px; background: var(--accent); transition: width 1s;
  }
  .score-num { font-size: 0.85rem; font-weight: 700; color: var(--accent2); min-width: 36px; }
  .lesson-card {
    border-radius: 10px; padding: 14px 16px;
    background: var(--bg2); border-left: 3px solid var(--accent);
  }
  .lesson-num { font-size: 0.75rem; font-weight: 700; color: var(--accent2); margin-bottom: 4px; }

  /* Transitions */
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Divider */
  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* Input */
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 500; color: var(--text2); }
  .input-group input, .input-group textarea, .input-group select {
    width: 100%; padding: 10px 14px; border-radius: 9px;
    border: 1px solid var(--border2); background: var(--bg2); color: var(--text);
    font-size: 0.9rem; outline: none; transition: border 0.2s;
    font-family: inherit;
  }
  .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
    border-color: var(--accent);
  }
  .input-group textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--bg2); }

  /* Hero */
  .hero { text-align: center; padding: 40px 0 20px; }
  .hero-icon { font-size: 4rem; margin-bottom: 16px; }
  .hero-tagline {
    font-size: 0.9rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent2); margin-bottom: 12px;
  }

  /* Completion confetti */
  .trophy-section { text-align: center; padding: 20px 0; }
  .trophy { font-size: 4rem; animation: bounce 0.6s ease; }
  @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }

  /* Scrollable when needed */
  .scroll-hint { text-align: center; color: var(--text2); font-size: 0.8rem; margin-top: 8px; }

  /* Nav footer */
  .nav-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border);
  }

  /* Tooltip (simple) */
  .info-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
    border-radius: 20px; background: var(--blue-bg); color: var(--blue);
    font-size: 0.75rem; font-weight: 600; margin: 4px 4px 4px 0;
  }
</style>
</head>

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function CopyButton({ text }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = () => {
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };
  return (
    <button className="copy-btn" onClick={handleCopy}>
      {copied ? "✓ Copied!" : "📋 Copy this prompt"}
    </button>
  );
}

function ProgressBar({ step, total }) {
  return (
    <div className="progress-bar">
      {Array.from({ length: total }).map((_, i) => (
        <div
          key={i}
          className={`progress-step ${i < step ? 'done' : i === step ? 'active' : ''}`}
        />
      ))}
    </div>
  );
}

function ExplainBox({ what, why }) {
  return (

  );
}

function PlatformScreen({ brand, onNext }) {
  const [selected, setSelected] = useState([]);
  const isPersonal = brand.mode === 'personal';
  const MAX = 3;

  const toggle = (id) => {
    setSelected(prev =>
      prev.includes(id) ? prev.filter(p => p !== id) : prev.length < MAX ? [...prev, id] : prev
    );
  };

  const getSuggested = (p) => {
    if (isPersonal) return p.personalWeight >= 4;
    const lower = [brand.industry, brand.audience, brand.product].join(' ').toLowerCase();
    return p.audiences.some(a => lower.includes(a));
  };

  const promptText = isPersonal
    ? `I'm ${brand.name}, building a personal brand around ${brand.niche}.\nMy audience: ${brand.audience}\n\nWhich 2–3 social media platforms should I focus on first to grow a personal brand in this niche?\nFor each platform, explain:\n- Why it's a good or bad fit for personal branding in my space\n- What type of content works best for personal brands here\n- How often I should post to start\n- One personal brand example who does it well on this platform`
    : `I'm building the marketing strategy for ${brand.name} (${brand.industry}).\nTarget audience: ${brand.audience}\nBudget: ${brand.budget}\n\nWhich 2–3 social media platforms should we focus on first?\nFor each platform, explain:\n- Why it fits (or doesn't) for this specific business and audience\n- What content format performs best here\n- Estimated time and cost to do it well\n- One competitor or brand doing this platform well in our space`;

  return (
    <div className="fade-in">
      <div className="section-header">
        <div className="step-badge">Step 2 of 5 · Platform Strategy</div>
        <h2>Choose your platforms</h2>
        <p className="subtitle">Pick up to {MAX}. {isPersonal ? "For personal brands, LinkedIn, X/Twitter, YouTube and newsletters build lasting authority." : "Better to do 2 platforms well than 6 platforms poorly."}</p>
      </div>

      <ExplainBox
        what={isPersonal
          ? "Platform strategy for personal brands means finding where your specific audience already is — and where they go to learn, not just scroll."
          : "Platform strategy is about matching your content format, your audience's habits, and your resources. Not every platform is right for every brand."}
        why="Every platform has a different culture, algorithm, and audience behavior. Spreading yourself across all of them burns resources without results. Choose deliberately."
      />

      <div style={{ marginBottom: 8, marginTop: 16 }}>
        <span className="badge badge-green">✓ Suggested for you</span>
        <span style={{ margin: '0 8px', color: 'var(--text2)', fontSize: '0.8rem' }}>· Select up to {MAX} · {selected.length}/{MAX} chosen</span>
      </div>

      <div className="grid2" style={{ marginTop: 12 }}>
        {PLATFORMS.map(p => {
          const suggested = getSuggested(p);
          const isSelected = selected.includes(p.id);
          const isMaxed = !isSelected && selected.length >= MAX;
          return (
            <div
              key={p.id}
              className={`platform-card ${isSelected ? 'selected' : ''} ${isMaxed ? 'not-recommended' : ''}`}
              onClick={() => !isMaxed && toggle(p.id)}
            >
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div className="platform-icon">{p.emoji}</div>
                {suggested && <span className="badge badge-green" style={{ fontSize: '0.7rem', padding: '2px 8px' }}>Suggested</span>}
                {isSelected && <span className="badge badge-purple" style={{ fontSize: '0.7rem', padding: '2px 8px' }}>✓ Chosen</span>}
              </div>
              <div className="platform-name">{p.name}</div>
              <div className="platform-why">{p.reason}</div>
            </div>
          );
        })}
      </div>

      <ClaudePromptCard
        title="Platform strategy deep-dive"
        prompt={promptText}
      />

      <div className="nav-footer">
        <div className="muted small">{selected.length} of {MAX} selected</div>
        <button
          className="btn btn-primary"
          disabled={selected.length === 0}
          onClick={() => onNext(selected.map(id => PLATFORMS.find(p => p.id === id)))}
        >
          Choose Content Pillars →
        </button>
      </div>
    </div>
  );
}

      </div>

      <div className="grid2">
        {pillars.map((p, i) => {
          const isSelected = selected.includes(p.id);
          const isMaxed = !isSelected && selected.length >= MAX;
          const rank = selected.indexOf(p.id) + 1;
          return (
            <div
              key={p.id}
              className={`pillar-card ${isSelected ? 'selected' : ''} ${isMaxed ? 'maxed' : ''}`}
              onClick={() => !isMaxed && toggle(p.id)}
            >
              {isSelected && <div className="pillar-num">{rank}</div>}
              <div style={{ fontSize: '1.4rem', marginBottom: 8 }}>{p.emoji}</div>
              <div style={{ fontWeight: 600, fontSize: '0.95rem', marginBottom: 6 }}>{p.name}</div>
              <div className="small muted" style={{ marginBottom: 8 }}>{p.goal}</div>
              <div className="small" style={{ color: 'var(--text2)', fontStyle: 'italic' }}>e.g. {p.example}</div>
            </div>
          );
        })}
      </div>

      {selected.length === 3 && (
        <div className="card fade-in" style={{ background: 'var(--green-bg)', borderColor: 'var(--green)', marginTop: 20 }}>
          <div className="label" style={{ color: 'var(--green)' }}>✓ Your 3 pillars</div>
          <div style={{ marginTop: 8, display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            {selected.map(id => {
              const p = pillars.find(x => x.id === id);
              return <span key={id} className="badge badge-green">{p.emoji} {p.name}</span>;
            })}
          </div>
          <p className="small muted" style={{ marginTop: 10 }}>Every piece of content you create should fit into one of these three themes. If it doesn't — don't post it.</p>
        </div>
      )}

      <ClaudePromptCard
        title="Content pillar development prompt"
        prompt={promptText}
      />

      <div className="nav-footer">
        <div className="muted small">{selected.length} of 3 selected</div>
        <button
          className="btn btn-primary"
          disabled={selected.length < 3}
          onClick={() => onNext(selected.map(id => pillars.find(p => p.id === id)))}
        >
          Build Content Roadmap →
        </button>
      </div>
    </div>
  );
}

function RoadmapScreen({ brand, platforms, pillars, onNext }) {
  const isPersonal = brand.mode === 'personal';

  const weeks = isPersonal ? [
    {
      week: 1,
      color: 'var(--accent)',
      goal: "Define your POV and set the foundation",
      strategy: "Optimize your bio on all chosen platforms. Write and publish your origin story — the post that explains who you are and why you're here. Don't try to go viral. Try to be clear.",
      tactic: `Pillars: ${pillars[0].name}`,
      metric: "Profile views, bio clicks, DMs received"
    },
    {
      week: 2,
      color: 'var(--teal)',
      goal: "Start creating — consistency over perfection",
      strategy: `Post 2–3 times using your ${pillars[1].name} pillar. Engage in 10 conversations per day on ${platforms[0]?.name}. Reply to people in your niche. Be useful before you try to be followed.`,
      tactic: `Pillars: ${pillars[1].name}`,
      metric: "Replies, comments, new connections, follower growth"
    },
    {
      week: 3,
      color: 'var(--green)',
      goal: "Test and find what resonates",
      strategy: `Mix content from all 3 pillars. Track which posts get the most engagement. At this point, you're gathering data — which format, topic, or tone do people respond to most?`,
      tactic: `Pillars: All three — ${pillars.map(p => p.name).join(', ')}`,
      metric: "Engagement rate per post type, saves vs. likes"
    },
    {
      week: 4,
      color: 'var(--amber)',
      goal: "Double down on what's working",
      strategy: `Create more of whatever landed in Week 3. Start a weekly ritual — a consistent post format your audience can expect. Consistency builds audiences more than virality.`,
      tactic: "Pillar: Your highest-performing topic from Week 3",
      metric: "Return visitors, profile follows, direct messages"
    }
  ] : [
    {
      week: 1,
      color: 'var(--accent)',
      goal: "Audit, anchor, and set the foundation",
      strategy: `Before creating anything new, audit what already exists. Check ${brand.name}'s current social profiles, website, and any existing content. Set up tracking: install analytics, create a simple content calendar. This week is about understanding the baseline.`,
      tactic: `First piece of content: A ${pillars[0].name} post introducing who ${brand.name} is and what problem you solve`,
      metric: "Baseline follower count, website traffic, email subscribers"
    },
    {
      week: 2,
      color: 'var(--teal)',
      goal: "Launch content across chosen platforms",
      strategy: `Post 3× per platform using ${pillars[0].name} and ${pillars[1].name} pillars. Don't promote yet — focus on providing value and establishing a voice. Engage with comments. This is the seedling phase.`,
      tactic: `Pillar rotation: ${pillars[0].name} → ${pillars[1].name} → ${pillars[0].name}`,
      metric: "Engagement rate (aim for 3%+), profile visits, saves/shares"
    },
    {
      week: 3,
      color: 'var(--green)',
      goal: "Amplify with paid or partnerships",
      strategy: `If budget allows, boost your 1 best-performing post from Week 2. Reach out to 3 micro-influencers or complementary brands about a content swap or collaboration. ${brand.challenge ? 'This week directly addresses your challenge: ' + brand.challenge : 'This is where reach starts to compound.'}`,
      tactic: `Pillar focus: ${pillars[2].name} — the community-building and awareness play`,
      metric: "Reach, follower growth, cost per engagement if running paid"
    },
    {
      week: 4,
      color: 'var(--amber)',
      goal: "Analyze, learn, and set the next 30 days",
      strategy: `Pull your data. Which platform performed best? Which pillar got the most engagement? Which type of post drove the most action? Write a one-page strategy brief for next month based on what you learned — not what you hoped.`,
      tactic: "All 3 pillars — focus on turning top-of-funnel attention into mid-funnel intent (email sign-ups, saves, DMs)",
      metric: "Month-over-month growth, conversion rate to email/website, most shared content"
    }
  ];

  const platformNames = platforms.map(p => p.name).join(', ');
  const pillarNames = pillars.map(p => p.name).join(', ');
  const promptText = isPersonal
    ? `I'm ${brand.name}, building a personal brand in ${brand.niche}.\nMy platforms: ${platformNames}\nContent pillars: ${pillarNames}\n\nCreate a detailed 30-day content roadmap for my personal brand.\nFor each of the 4 weeks, give me:\n1. A strategic goal for the week (not just 'post more')\n2. 3 specific content ideas based on my pillars\n3. A community-building tactic I should execute\n4. What I should be measuring to know if it's working\n\nMy POV: ${brand.differentiator || 'Still refining'}`
    : `I'm developing the 30-day marketing roadmap for ${brand.name} (${brand.industry}).\nPlatforms: ${platformNames}\nContent pillars: ${pillarNames}\nBudget: ${brand.budget}\nCore challenge: ${brand.challenge}\n\nCreate a strategic 30-day content roadmap.\nFor each of the 4 weeks, include:\n1. Weekly strategic goal (tied to solving our core challenge)\n2. 3 specific content ideas with format and platform\n3. One paid or partnership amplification tactic\n4. Key metrics to track that week`;

  return (
    <div className="fade-in">
      <div className="section-header">
        <div className="step-badge">Step 4 of 5 · 30-Day Roadmap</div>
        <h2>Your 30-day content roadmap</h2>
        <p className="subtitle">This is a strategic roadmap — focused on weekly goals and direction, not individual daily posts. Real marketing plans give you a compass, not a script.</p>
      </div>

      <ExplainBox
        what="A content roadmap is a structured plan that tells you what to focus on each week and why. It connects your business goals to your daily content decisions."
        why="Without a roadmap, you create content based on how you feel that day. With one, you create content based on where you're trying to go. The difference is strategy vs. noise."
      />

      <div style={{ marginTop: 24 }}>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 20 }}>
          {platforms.map(p => <span key={p.id} className="badge badge-blue">{p.emoji} {p.name}</span>)}
          {pillars.map(p => <span key={p.id} className="badge badge-purple">{p.emoji} {p.name}</span>)}
        </div>

        {weeks.map((w, i) => (
          <div key={i} className="week-block fade-in" style={{ borderColor: w.color }}>
            <div className="week-label" style={{ color: w.color }}>Week {w.week}</div>
            <div className="week-goal">{w.goal}</div>
            <div className="week-tactic" style={{ marginTop: 8 }}>{w.strategy}</div>
            <div style={{ marginTop: 10, display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <span className="info-chip">📊 {w.metric}</span>
              <span className="tag">{w.tactic}</span>
            </div>
          </div>
        ))}
      </div>

      <div className="card" style={{ background: 'var(--amber-bg)', borderColor: 'var(--amber)', marginTop: 8 }}>
        <div className="label" style={{ color: 'var(--amber)' }}>⚡ The Golden Rule</div>
        <p style={{ marginTop: 8, fontWeight: 500 }}>Done is better than perfect. One post a week executed consistently for 12 weeks beats a perfect content plan that never ships.</p>
      </div>

      <ClaudePromptCard
        title="30-day content roadmap prompt"
        prompt={promptText}
      />

      <div className="nav-footer">
        <div />
        <button className="btn btn-primary" onClick={onNext}>Face a Marketing Event →</button>
      </div>
    </div>
  );
}

function EventScreen({ brand, onNext }) {
  const [event] = useState(() => pick(brand.mode === 'personal' ? EVENTS_PERSONAL : EVENTS_BUSINESS));
  const [chosen, setChosen] = useState(null);
  const isPersonal = brand.mode === 'personal';

  const handleChoose = (r) => {
    if (!chosen) setChosen(r);
  };

  return (
    <div className="fade-in">
      <div className="section-header">
        <div className="step-badge">Step 5 of 5 · Unexpected Event</div>
        <h2>Something just happened</h2>
        <p className="subtitle">Real marketing is full of surprises. How you respond in the moment defines your brand more than any content plan.</p>
      </div>

      <ExplainBox
        what="Marketing events are unexpected situations that require real-time decision making. They test your brand values, your judgment, and your communication skills."
        why="The brands (and personal brands) that grow fastest are the ones that respond well to surprises — not because they predicted them, but because they had clear values to guide their decisions."
      />

      <div className="event-card fade-in">
        <div className="event-emoji">{event.emoji}</div>
        <div className="label" style={{ color: 'var(--amber)' }}>Breaking Situation</div>
        <h3 style={{ marginTop: 4, marginBottom: 12 }}>{event.title}</h3>
        <p style={{ lineHeight: 1.7 }}>{event.description}</p>
      </div>

      <div style={{ marginTop: 24 }}>
        <div className="label" style={{ marginBottom: 12 }}>How do you respond?</div>
        {event.responses.map(r => (
          <div
            key={r.id}
            className={`response-option ${chosen?.id === r.id ? 'chosen' : ''}`}
            onClick={() => handleChoose(r)}
            style={{ opacity: chosen && chosen.id !== r.id ? 0.5 : 1 }}
          >
            <div style={{ fontWeight: 500, marginBottom: chosen ? 8 : 0 }}>{r.label}</div>
            {chosen?.id === r.id && (
              <div className="fade-in">
                <div
                  className={`badge ${r.impact === 'positive' ? 'badge-green' : r.impact === 'negative' ? 'badge-red' : 'badge-amber'}`}
                  style={{ marginBottom: 8 }}
                >
                  {r.impact === 'positive' ? '✓ Smart move' : r.impact === 'negative' ? '✗ Costly mistake' : '~ Acceptable'}
                </div>
                <p className="small" style={{ color: 'var(--text)', lineHeight: 1.6 }}>{r.outcome}</p>
              </div>
            )}
          </div>
        ))}
      </div>

      {chosen && (
        <div className="fade-in">
          <div className="card" style={{
            background: chosen.impact === 'positive' ? 'var(--green-bg)' : chosen.impact === 'negative' ? 'var(--red-bg)' : 'var(--amber-bg)',
            borderColor: chosen.impact === 'positive' ? 'var(--green)' : chosen.impact === 'negative' ? 'var(--red)' : 'var(--amber)',
            marginTop: 20
          }}>
            <div className="label" style={{ color: chosen.impact === 'positive' ? 'var(--green)' : chosen.impact === 'negative' ? 'var(--red)' : 'var(--amber)' }}>
              {chosen.impact === 'positive' ? '💡 Why this worked' : chosen.impact === 'negative' ? '⚠️ What went wrong' : '💡 The tradeoff'}
            </div>
            <p className="small" style={{ marginTop: 8, lineHeight: 1.7 }}>{chosen.outcome}</p>
          </div>

          <div className="nav-footer">
            <div />
            <button className="btn btn-primary" onClick={() => onNext({ event, choice: chosen })}>
              See Your Growth Report →
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ReportScreen({ brand, platforms, pillars, eventResult, onRestart }) {
  const isPersonal = brand.mode === 'personal';
  const [revealed, setRevealed] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setRevealed(true), 300);
    return () => clearTimeout(t);
  }, []);

  const scores = {
    audience: Math.floor(Math.random() * 20) + 70,
    platform: Math.floor(Math.random() * 20) + 65,
    content: Math.floor(Math.random() * 15) + 72,
    growth: Math.floor(Math.random() * 25) + 60
  };

  const choiceImpact = eventResult.choice.impact;

  const lessons = isPersonal ? [
    {
      num: "01",
      title: "Authenticity is a competitive advantage",
      body: "In a world of polished content, real stories cut through. Your lived experience in " + brand.niche + " is something no one else can copy — not your competitors, not AI. Lead with it."
    },
    {
      num: "02",
      title: "Consistency creates authority",
      body: "A personal brand is built post by post, over months. The creators who win aren't the most talented — they're the ones who show up when no one is watching yet. Show up anyway."
    },
    {
      num: "03",
      title: "Niche clarity attracts, broad positioning repels",
      body: `By choosing to own a specific corner of ${brand.niche}, you make yourself magnetic to the right people — and irrelevant to the wrong ones. That's not a bug, it's the strategy.`
    }
  ] : [
    {
      num: "01",
      title: "Audience understanding beats clever creative",
      body: `The deepest competitive advantage ${brand.name} can build is knowing their customer better than anyone else. Features can be copied. Deep audience understanding cannot.`
    },
    {
      num: "02",
      title: "Focus is a marketing strategy",
      body: `Choosing ${platforms.slice(0, 2).map(p => p.name).join(' and ')} over all other platforms isn't a limitation — it's a decision. The brands that try to be everywhere are memorable nowhere.`
    },
    {
      num: "03",
      title: "Content without strategy is just noise",
      body: `Your three content pillars (${pillars.map(p => p.name).join(', ')}) aren't just categories — they're a promise to your audience about what you'll consistently give them. Keep that promise.`
    }
  ];

  const bestDecision = platforms.length > 0 ? `Choosing to focus on ${platforms.slice(0, 2).map(p => p.name).join(' and ')} — platform discipline separates brands that grow from brands that spread thin.` : "Building a clear content pillar strategy from the start.";
  const biggestMistake = choiceImpact === 'negative' ? `Your response to "${eventResult.event.title}" — ${eventResult.choice.outcome.slice(0, 120)}...` : "Not defining audience deeply enough before choosing tactics — understanding comes before execution.";

  const promptText = isPersonal
    ? `I've just finished a 30-day personal brand strategy exercise as ${brand.name} in the ${brand.niche} space.\n\nHere's what I decided:\n- Platforms: ${platforms.map(p => p.name).join(', ')}\n- Content pillars: ${pillars.map(p => p.name).join(', ')}\n- My differentiator: ${brand.differentiator || 'Still defining'}\n\nNow act as my personal brand mentor. Give me:\n1. A 90-day growth plan for what to do after Month 1\n2. The single biggest mistake personal brands in ${brand.niche} make after 30 days\n3. How to monetize a personal brand in this niche once I have an audience\n4. A community-building strategy specifically for ${brand.niche}`
    : `I've just completed the 30-day marketing strategy for ${brand.name} (${brand.industry}).\n\nDecisions made:\n- Platforms: ${platforms.map(p => p.name).join(', ')}\n- Content pillars: ${pillars.map(p => p.name).join(', ')}\n- Core challenge: ${brand.challenge}\n\nNow act as a fractional CMO. Give me:\n1. A 90-day growth plan building on Month 1\n2. When and how to start paid advertising\n3. The metrics I should review in a monthly marketing meeting\n4. One growth experiment I should run in Month 2 to test assumptions`;

  return (
    <div className="fade-in">
      <div className="trophy-section">
        <div className="trophy">📊</div>
        <div className="hero-tagline" style={{ marginTop: 12 }}>Campaign Complete</div>
        <h2>Your Growth Report</h2>
        <p className="subtitle">{isPersonal ? `A strategic review of ${brand.name}'s personal brand foundation` : `A strategic review of ${brand.name}'s 30-day marketing plan`}</p>
      </div>

      <div className="grid2" style={{ marginTop: 24 }}>
        {[
          { label: "Audience Understanding", score: scores.audience, color: 'var(--accent)' },
          { label: "Platform Strategy", score: scores.platform, color: 'var(--teal)' },
          { label: "Content Strategy", score: scores.content, color: 'var(--green)' },
          { label: "Growth Potential", score: scores.growth, color: 'var(--amber)' }
        ].map((s, i) => (
          <div key={i} className="card card-sm">
            <div className="label">{s.label}</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 8 }}>
              <div className="score-bar-outer" style={{ flex: 1 }}>
                <div className="score-bar-inner" style={{ width: revealed ? s.score + '%' : '0%', background: s.color }} />
              </div>
              <div style={{ fontWeight: 700, fontSize: '1rem', color: s.color }}>{s.score}</div>
            </div>
          </div>
        ))}
      </div>

      <div className="report-section" style={{ marginTop: 8 }}>
        <div className="label" style={{ color: 'var(--green)', marginBottom: 12 }}>✓ Best Decision</div>
        <p>{bestDecision}</p>
      </div>

      <div className="report-section" style={{ borderColor: 'var(--red)' }}>
        <div className="label" style={{ color: 'var(--red)', marginBottom: 12 }}>✗ Biggest Mistake to Avoid</div>
        <p>{biggestMistake}</p>
      </div>

      <div style={{ marginTop: 24, marginBottom: 8 }}>
        <div className="label">Three marketing lessons from this run</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {lessons.map((l, i) => (
          <div key={i} className="lesson-card fade-in">
            <div className="lesson-num">Lesson {l.num}</div>
            <div style={{ fontWeight: 600, marginBottom: 4 }}>{l.title}</div>
            <p className="small muted">{l.body}</p>
          </div>
        ))}
      </div>

      <div className="card" style={{ background: 'var(--accent-bg)', borderColor: 'var(--accent)', marginTop: 24 }}>
        <div className="label" style={{ color: 'var(--accent2)' }}>📋 Your Strategy Summary</div>
        <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div>
            <div className="label">Platforms chosen</div>
            <div className="tag-row">{platforms.map(p => <span key={p.id} className="badge badge-blue">{p.emoji} {p.name}</span>)}</div>
          </div>
          <div>
            <div className="label">Content pillars</div>
            <div className="tag-row">{pillars.map(p => <span key={p.id} className="badge badge-purple">{p.emoji} {p.name}</span>)}</div>
          </div>
          <div>
            <div className="label">Event outcome</div>
            <span className={`badge ${choiceImpact === 'positive' ? 'badge-green' : choiceImpact === 'negative' ? 'badge-red' : 'badge-amber'}`}>
              {choiceImpact === 'positive' ? '✓ Smart response' : choiceImpact === 'negative' ? '✗ Costly mistake' : '~ Neutral outcome'}
            </span>
          </div>
        </div>
      </div>

      <ClaudePromptCard
        title={isPersonal ? "90-day personal brand growth prompt" : "90-day growth strategy prompt"}
        prompt={promptText}
      />

      <div style={{ textAlign: 'center', marginTop: 32, padding: '24px 0' }}>
        <p className="muted small" style={{ marginBottom: 16 }}>Ready to run a different scenario?</p>
        <button className="btn btn-primary" onClick={onRestart} style={{ marginRight: 12 }}>
          🎲 New Client
        </button>
        <button className="btn btn-secondary" onClick={onRestart}>
          ↩ Start Over
        </button>
      </div>
    </div>
  );
}

// ───────────────────────────────────────────────
// MAIN APP
// ───────────────────────────────────────────────

const TOTAL_STEPS = 7;

function App() {
  const [screen, setScreen] = useState('welcome');
  const [brand, setBrand] = useState(null);
  const [platforms, setPlatforms] = useState([]);
  const [pillars, setPillars] = useState([]);
  const [eventResult, setEventResult] = useState(null);
  const [stepNum, setStepNum] = useState(0);
  const topRef = useRef(null);

  const scrollToTop = () => {
    if (topRef.current) topRef.current.scrollIntoView({ behavior: 'smooth' });
  };

  const go = (nextScreen, nextStep) => {
    scrollToTop();
    setTimeout(() => {
      setScreen(nextScreen);
      setStepNum(nextStep);
    }, 60);
  };

  const handleStart = (mode) => {
    if (mode === 'random') {
      const b = pick(RANDOM_BUSINESSES);
      setBrand({ ...b, mode: 'random' });
      go('understand', 1);
    } else if (mode === 'business') {
      go('setup-business', 0);
    } else {
      go('setup-personal', 0);
    }
  };

  const handleBusinessSetup = (data) => {
    setBrand(data);
    go('understand', 1);
  };

  const handlePersonalSetup = (data) => {
    setBrand(data);
    go('understand', 1);
  };

  const handleUnderstand = () => go('platforms', 2);
  const handlePlatforms = (p) => { setPlatforms(p); go('pillars', 3); };
  const handlePillars = (p) => { setPillars(p); go('roadmap', 4); };
  const handleRoadmap = () => go('event', 5);
  const handleEvent = (result) => { setEventResult(result); go('report', 6); };

  const handleRestart = () => {
    setBrand(null); setPlatforms([]); setPillars([]); setEventResult(null);
    go('welcome', 0);
  };

  const showProgress = screen !== 'welcome' && screen !== 'setup-business' && screen !== 'setup-personal';

  return (
    <div className="app">
      <div ref={topRef} />
      {showProgress && <ProgressBar step={stepNum} total={TOTAL_STEPS} />}

      {screen === 'welcome' && <WelcomeScreen onStart={handleStart} />}
      {screen === 'setup-business' && <BusinessSetupScreen onNext={handleBusinessSetup} />}
      {screen === 'setup-personal' && <PersonalBrandSetupScreen onNext={handlePersonalSetup} />}
      {screen === 'understand' && brand && <BrandUnderstandScreen brand={brand} onNext={handleUnderstand} />}
      {screen === 'platforms' && brand && <PlatformScreen brand={brand} onNext={handlePlatforms} />}
      {screen === 'pillars' && brand && <ContentPillarsScreen brand={brand} platforms={platforms} onNext={handlePillars} />}
      {screen === 'roadmap' && brand && <RoadmapScreen brand={brand} platforms={platforms} pillars={pillars} onNext={handleRoadmap} />}
      {screen === 'event' && brand && <EventScreen brand={brand} onNext={handleEvent} />}
      {screen === 'report' && brand && eventResult && <ReportScreen brand={brand} platforms={platforms} pillars={pillars} eventResult={eventResult} onRestart={handleRestart} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
